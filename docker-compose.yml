services:
  db:
    image: postgres:16-alpine
    container_name: sales-plan-dashboard-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Только localhost: приложение ходит в БД по docker-сети (db:5432), наружу
    # публиковать незачем. Раньше "5432:5432" открывал Postgres на всех интерфейсах —
    # на публичном VDS это БД в интернете. Для psql с хоста localhost-проброса хватает.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sales-plan-dashboard-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: ${PORT}
      INGEST_API_KEY: ${INGEST_API_KEY}
      DATABASE_URL: ${DATABASE_URL}
      # CORS: по умолчанию '*' (открыто всем origin'ам — как исторически). Чтобы запереть
      # на конкретный домен — задать CORS_ORIGIN в .env (напр. https://dashboard.example.ru),
      # либо пусто = same-origin (без CORS-заголовков).
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
