<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Мария — План выпуска</title>
<link rel="icon" type="image/png" href="/logo-girl.png" />
<style>
  :root{ --bg:#0e1118; --paper:#191d28; --paper2:#1f2532; --line:#2a3140; --ink:#e8ecf4; --muted:#8b94a7;
    --good:#10a05a; --bad:#e0466a; --warn:#d9a528; --accent:#5b8cff; }
  *{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:'Inter Tight',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:14px}
  .wrap{max-width:1500px;margin:0 auto;padding:18px}
  header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px}
  h1{font-size:20px;margin:0;font-weight:700}
  .sub{color:var(--muted);font-size:12px}
  .ctrl{display:flex;align-items:center;gap:10px;margin-left:auto;flex-wrap:wrap}
  input[type=date],button{background:var(--paper2);color:var(--ink);border:1px solid var(--line);
    border-radius:9px;padding:7px 11px;font-size:13px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .kpis{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .kpi{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 16px;min-width:130px}
  .kpi .v{font-size:22px;font-weight:700} .kpi .l{color:var(--muted);font-size:11px;margin-top:2px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
  th{position:sticky;top:0;background:var(--paper2);z-index:2;color:var(--muted);font-weight:600;font-size:11px}
  td:first-child,th:first-child{text-align:left}
  tr.ceh td{background:#222a3a;font-weight:700;color:#cdd6e8;border-top:2px solid var(--accent)}
  tr.def td{background:rgba(224,70,106,.08)}
  .task{color:var(--good);font-weight:700}
  .neg{color:var(--bad)} .pos{color:var(--good)} .mut{color:var(--muted)}
  .auto{font-size:11px;color:var(--muted)}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:5px;animation:p 2s infinite}
  @keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
  .yoycol{color:var(--warn)}
  #err{color:var(--bad);padding:10px}
  .warnbox{background:rgba(217,165,40,.12);border:1px solid #6b5518;color:#e8c35a;
    border-radius:9px;padding:8px 12px;margin:6px 0;font-size:12.5px;line-height:1.45}
  .fc{font-size:9px;color:var(--warn);font-weight:600;letter-spacing:.3px}
  .note{color:var(--muted);font-size:11px;margin-top:10px;line-height:1.5}
  .convbox{border:1px solid var(--line,#2a2f3a);border-radius:10px;padding:12px 14px;margin:10px 0;background:rgba(120,160,255,.05)}
  .convhead{font-weight:600;font-size:14px;margin-bottom:8px}
  .convhead button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px}
  .convkpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .convsub{font-size:12px;color:var(--muted);margin:12px 0 4px}
  .convtbl{width:100%;border-collapse:collapse;font-size:12px}
  .convtbl th{text-align:left;color:var(--muted);font-weight:500;padding:3px 8px;border-bottom:1px solid var(--line,#2a2f3a)}
  .convtbl td{padding:3px 8px;border-bottom:1px solid rgba(128,128,128,.12)}
  .pos{color:#4caf50}.neg{color:#e5736b}
  .approx{display:inline-block;font-size:10px;font-weight:600;color:#b8860b;background:rgba(184,134,11,.13);border:1px solid rgba(184,134,11,.4);border-radius:8px;padding:1px 7px;margin-left:8px;letter-spacing:.2px;vertical-align:middle}
  tr.ceh-approx td{background:rgba(184,134,11,.05)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1><a href="/" style="text-decoration:none;color:var(--muted);font-size:15px;margin-right:6px" title="В дашборд">←</a>🧁 План выпуска кондитерки</h1>
      <div class="sub" id="sub">загрузка…</div>
    </div>
    <div class="ctrl">
      <input type="date" id="date" />
      <button id="yoyBtn">📊 Прошлый год</button>
      <button id="convBtn" title="Сравнить план робота с фактическим заданием Маши за прошлый день">🎯 Сходимость с Машей</button>
      <button id="xlsxBtn" title="Скачать xlsx и переслать Маше">⬇ Файл для Маши</button>
      <button id="refresh">⟳ Обновить</button>
      <span class="auto" id="auto"></span>
    </div>
  </header>
  <div class="kpis" id="kpis"></div>
  <div id="warn"></div>
  <div id="conv"></div>
  <div id="err"></div>
  <div id="tbl"></div>
  <div class="note" id="note"></div>
</div>
<script>
var YOY=false, AUTO=null;
function n1(x){ return x==null?'':(Math.round(x*10)/10).toLocaleString('ru'); }
function tomorrowISO(){ var t=new Date(Date.now()+86400000); return t.toISOString().slice(0,10); }
function fetchPlan(){
  var date=document.getElementById('date').value||tomorrowISO();
  document.getElementById('sub').textContent='загрузка плана на '+date+'…';
  var url='/api/production/plan?date='+date+(YOY?'&yoy=1':'');
  fetch(url).then(function(r){return r.json();}).then(render).catch(function(e){
    document.getElementById('err').textContent='Ошибка: '+e.message;
  });
}
function render(d){
  document.getElementById('err').textContent='';
  if(d.error){ document.getElementById('err').textContent='Ошибка 1С: '+d.error; return; }
  document.getElementById('sub').innerHTML='на <b>'+d.date+'</b> ('+d.weekday+') · послезавтра '+d.nextWeekday+
    ' · <span class="dot"></span>обновлено '+new Date(d.refreshedAt).toLocaleTimeString('ru');
  var t=d.totals||{};
  // баннер предупреждений о неполноте/контексте данных (защита от «принять неполное за факт»)
  var warns=(d.warnings||[]).slice();
  if(t.skippedNonPlan) warns.push('Отброшено '+t.skippedNonPlan+' позиций не из планового списка (упаковка/брак/компоненты) — это норма, в план идут только продукты Маши.');
  document.getElementById('warn').innerHTML = warns.length
    ? warns.map(function(w){return '<div class="warnbox">⚠️ '+w+'</div>';}).join('') : '';
  document.getElementById('kpis').innerHTML=
    kpi(t.skus,'позиций')+kpi(t.deficitCount,'в дефиците',(t.deficitCount?'neg':''))+
    kpi(n1(t.taskUnits),'к выпуску, шт','task')+
    (t.fSkus?kpi('+'+n1(t.fToday),'сегодня в работе (F)','fc'):'');
  var yoyTh = YOY? '<th class="yoycol">Год назад</th><th class="yoycol">Δ спрос</th>':'';
  var h='<div style="max-height:72vh;overflow:auto"><table><thead><tr>'+
    '<th>Наименование</th><th>ГП</th><th>Запас</th><th>Конт.</th><th>Сайт↓</th>'+
    '<th title="прогноз: среднее отгрузки по дню недели за 3 нед">Отгр.<br>завтра<br><span class="fc">прогноз</span></th>'+
    '<th title="прогноз">После-<br>завтра<br><span class="fc">прогноз</span></th><th>Сайт<br>п/з</th>'+
    '<th>Остаток-<br>прогноз</th><th>ИТОГО</th><th>ЗАДАНИЕ</th>'+yoyTh+'</tr></thead><tbody>';
  (d.ceh||[]).forEach(function(c){
    var cols = YOY?13:11;
    var approxBadge = c.approx ? ' <span class="approx" title="Партионное/мимо-хаба производство: робот видит спрос неполно (десерты/пирожные пекут партиями и везут в точки мимо хаба; заказные торты не прогнозируются). Цифры — ориентир, доверяйте опыту.">≈ прогноз приблизителен</span>' : '';
    h+='<tr class="ceh'+(c.approx?' ceh-approx':'')+'"><td colspan="'+cols+'">▓ '+c.name+'  ·  к выпуску '+n1(c.task)+' шт ('+c.deficit+' поз.)'+approxBadge+'</td></tr>';
    c.items.forEach(function(it){
      var yoy = YOY? '<td class="yoycol">'+(it.lyShip!=null?n1(it.lyShip):'—')+'</td><td class="yoycol '+(it.deltaPct>0?'pos':(it.deltaPct<0?'neg':''))+'">'+(it.deltaPct!=null?(it.deltaPct>0?'+':'')+it.deltaPct+'%':'—')+'</td>':'';
      var shipCell = it.bom
        ? '<td title="разузловка: спрос из заданий родителей" style="color:#c39bff">🧩 '+(it.ship?n1(it.ship):'<span class="mut">·</span>')+'</td>'
        : td(it.ship);
      h+='<tr class="'+(it.task>0?'def':'')+'"><td>'+it.name+'</td>'+
        td(it.gp)+td(it.zap)+td(it.kont)+td(it.siteL,'mut')+shipCell+td(it.shipNext)+td(it.siteP,'mut')+
        td(it.N)+'<td class="'+(it.R<0?'neg':'')+'">'+n1(it.R)+'</td>'+
        '<td class="task">'+(it.task>0?n1(it.task):'')+'</td>'+yoy+'</tr>';
    });
  });
  h+='</tbody></table></div>';
  var approxN=(d.ceh||[]).filter(function(c){return c.approx;}).length;
  if(approxN) h+='<div class="note"><span class="approx">≈ прогноз приблизителен</span> — цеха партионного/мимо-хаба производства (десерты, пирожные, Торты 1/5, п/ф, заказные). Робот видит их спрос неполно: эти позиции пекут партиями раз в несколько дней и часть везут в точки мимо склада-хаба. Задание по ним — ориентир, итог за вами. Надёжно (дневной такт через хаб): Торты 2/3, фарши, слойка.</div>';
  document.getElementById('tbl').innerHTML=h;
  document.getElementById('note').textContent=d.note||'';
}
function kpi(v,l,cls){ return '<div class="kpi"><div class="v '+(cls||'')+'">'+(v==null?'—':v)+'</div><div class="l">'+l+'</div></div>'; }
// ── Сходимость робота с фактом Маши (метрика доверия) ──
function yesterdayISO(){ var t=new Date(Date.now()-86400000); return t.toISOString().slice(0,10); }
function loadConv(){
  var el=document.getElementById('conv');
  var date=document.getElementById('date').value||tomorrowISO();
  // если выбран прошедший день — сверяем его; иначе пусть бэкенд возьмёт последний ПОЛНЫЙ день АРМ
  var cd = date < tomorrowISO() ? date : '';
  el.innerHTML='<div class="warnbox">🎯 Считаю сходимость (робот vs задание Маши)…</div>';
  fetch('/api/production/convergence'+(cd?'?date='+cd:'')).then(function(r){return r.json();}).then(renderConv).catch(function(e){
    el.innerHTML='<div class="warnbox">Сходимость недоступна: '+e.message+'</div>';
  });
}
function pct(v){ return v==null?'—':v+'%'; }
function renderConv(d){
  var el=document.getElementById('conv');
  if(d.error){ el.innerHTML='<div class="warnbox">Ошибка: '+d.error+'</div>'; return; }
  if(!d.armFound){ el.innerHTML='<div class="warnbox">🎯 За '+d.date+' нет проведённого АРМ Планирования — не с чем сравнивать. Выбери прошедший рабочий день.</div>'; return; }
  var s=d.summary;
  var cover = s.coverPct;
  var head='<div class="convbox"><div class="convhead">🎯 Сходимость робота с заданием Маши · '+d.date+' ('+d.weekday+')'+
    ' <button id="convClose" style="float:right">✕</button></div>'+
    '<div class="convkpis">'+
    kpi(pct(cover),'покрытие плана (робот/Маша по шт)',(cover>=80?'task':(cover>=50?'':'neg')))+
    kpi(n1(s.sumRobot)+' / '+n1(s.sumMaria),'шт: робот / Маша')+
    kpi(pct(s.within25Pct),'совпало ±25% (из пересечения)')+
    kpi(s.both,'оба плана >0',(''))+
    '</div>';
  // разбивка по цехам — где роботу можно доверять, где нет
  var rows=(d.byCeh||[]).map(function(c){
    var cl = c.coverPct==null?'':(c.coverPct>=80?'pos':(c.coverPct>=50?'':'neg'));
    return '<tr><td>'+c.ceh+'</td><td class="'+cl+'">'+pct(c.coverPct)+'</td>'+
      '<td>'+n1(c.sumRobot)+'</td><td>'+n1(c.sumMaria)+'</td>'+
      '<td>'+pct(c.within25Pct)+'</td><td class="mut">'+c.robotOnly+' / '+c.mariaOnly+'</td></tr>';
  }).join('');
  head+='<table class="convtbl"><thead><tr><th>Цех</th><th>покрытие</th><th>робот шт</th><th>Маша шт</th><th>±25%</th><th class="mut">только роб/Маша</th></tr></thead><tbody>'+rows+'</tbody></table>';
  // топ-расхождения
  var diffs=(d.topDiffs||[]).slice(0,12).map(function(r){
    return '<tr><td>'+r.name+'</td><td class="mut">'+(r.ceh||'')+'</td><td>'+n1(r.robot)+'</td><td>'+n1(r.maria)+'</td><td class="'+(r.diff<0?'neg':'pos')+'">'+(r.diff>0?'+':'')+n1(r.diff)+'</td></tr>';
  }).join('');
  head+='<div class="convsub">Топ расхождений (робот − Маша):</div>'+
    '<table class="convtbl"><thead><tr><th>Продукт</th><th class="mut">цех</th><th>робот</th><th>Маша</th><th>Δ</th></tr></thead><tbody>'+diffs+'</tbody></table>';
  head+='<div class="note">'+(d.note||'')+'</div></div>';
  el.innerHTML=head;
  document.getElementById('convClose').onclick=function(){ el.innerHTML=''; };
}
function td(v,cls){ return '<td class="'+(cls||'')+'">'+(v?n1(v):'<span class="mut">·</span>')+'</td>'; }
document.getElementById('date').value=tomorrowISO();
document.getElementById('refresh').onclick=fetchPlan;
document.getElementById('xlsxBtn').onclick=function(){ var date=document.getElementById('date').value||tomorrowISO(); window.location='/api/production/plan.xlsx?date='+date; };
document.getElementById('date').onchange=fetchPlan;
document.getElementById('yoyBtn').onclick=function(){ YOY=!YOY; this.classList.toggle('on',YOY); fetchPlan(); };
document.getElementById('convBtn').onclick=loadConv;
// автообновление каждые 5 минут (real-time)
function setAuto(){ if(AUTO)clearInterval(AUTO); AUTO=setInterval(fetchPlan,300000); document.getElementById('auto').textContent='⟳ авто 5 мин'; }
setAuto(); fetchPlan();
</script>
</body>
</html>
